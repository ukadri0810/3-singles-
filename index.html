<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3Singles Café | Chiplun</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <script>
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                brandRed: '#b81d24',
                brandYellow: '#f3a633',
                brandGreen: '#259a61',
                charcoal: '#2d2926',
                warmCream: '#faf8f5',
                paper: '#f2eee8',
                ink: '#4a4643',
                divider: '#e5e1d8'
              },
              fontFamily: {
                serif: ['Playfair Display', 'serif'],
                sans: ['Inter', 'sans-serif'],
                handwriting: ['Caveat', 'cursive']
              }
            }
          }
        }
    </script>
    <style>
        body { background-color: #faf8f5; color: #2d2926; -webkit-font-smoothing: antialiased; }
        ::-webkit-scrollbar { display: none; }
        .mask-container { overflow: hidden; position: relative; }

        /* PRELOADER */
        .ambient-glow {
            background-color: #f8f7f4;
            background-image: radial-gradient(circle at center, rgba(255,255,255,0.9) 0%, #f8f7f4 70%);
        }
        .metal-housing {
            background: linear-gradient(145deg, #2c2e30, #0a0a0a);
            box-shadow: inset 2px 2px 6px rgba(255, 255, 255, 0.15), inset -2px -2px 6px rgba(0, 0, 0, 0.9), 0 25px 50px -12px rgba(0,0,0,0.5);
            border: 1px solid #222;
        }
        .signal-light {
            position: relative;
            background-color: #111;
            box-shadow: inset 0px 6px 12px rgba(0, 0, 0, 0.9);
            border: 2px solid #080808;
            overflow: hidden;
            border-radius: 50%;
        }
        .signal-light::after {
            content: '';
            position: absolute;
            top: 4%; left: 15%; width: 70%; height: 35%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.4), rgba(255,255,255,0));
            border-radius: 50%;
            pointer-events: none;
            filter: blur(1px);
        }
        #real-logo {
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background: white;
        }

        /* CAFE STYLE */
        .photo-frame {
            background-color: #ffffff;
            padding: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0, 0, 0, 0.03);
            border: 1px solid #eae6de;
            border-radius: 8px;
        }
        .photo-frame img { border-radius: 4px; }
    </style>
</head>

    <div id="loader-wrapper" class="fixed inset-0 z-50 flex items-center justify-center ambient-glow">
        <div class="housing-container relative flex flex-col items-center">
            <div id="traffic-housing" class="relative z-20 w-24 h-64 metal-housing rounded-full p-4 flex flex-col justify-between items-center">
                <div id="light-red" class="w-14 h-14 signal-light"></div>
                <div id="light-yellow" class="w-14 h-14 signal-light"></div>
                <div id="light-green" class="w-14 h-14 signal-light"></div>
            </div>
            <div id="loader-status" class="absolute top-[110%] w-64 h-8 flex justify-center items-center">
                <span id="text-red" class="absolute text-xs uppercase tracking-[0.2em] font-medium text-brandRed opacity-0">Preparing freshness</span>
                <span id="text-yellow" class="absolute text-xs uppercase tracking-[0.2em] font-medium text-brandYellow opacity-0">Warming flavours</span>
                <span id="text-green" class="absolute text-xs uppercase tracking-[0.2em] font-medium text-brandGreen opacity-0">Welcome to 3Singles</span>
            </div>
        </div>
        <div id="real-logo-container" class="absolute z-10 opacity-0 scale-[0.9] flex flex-col items-center justify-center">
            <img id="real-logo" src="logo.png" alt="3Singles Logo" class="w-56 md:w-80 lg:w-96 rounded-full p-2">
        </div>
    </div>

    <nav class="fixed top-0 w-full z-40 bg-warmCream/95 backdrop-blur-sm border-b border-divider">

                <span class="hidden sm:inline">Chiplun</span>
            </div>
            <div class="absolute left-1/2 -translate-x-1/2 top-4 md:top-5 z-50">
