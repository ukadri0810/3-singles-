<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>3Singles Cafe | Premium Loader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="site-shell" aria-label="3Singles Cafe demo page">
    <section class="hero">
      <nav class="nav">
        <img src="assets/logo-transparent.png" alt="3Singles Cafe Chiplun" class="nav-logo" />
        <a href="#" class="nav-cta">Visit Cafe</a>
      </nav>
      <div class="hero-copy">
        <p class="eyebrow">Chiplun's warm cafe corner</p>
        <h1>Fresh brews, soft bites, and conversations worth pausing for.</h1>
        <p>Premium website demo with a custom motion-led first impression.</p>
      </div>
    </section>
  </main>

  <section class="loader" id="loader" aria-label="Loading 3Singles Cafe website">
    <div class="grain" aria-hidden="true"></div>

    <svg class="line-art line-art-left" viewBox="0 0 220 220" aria-hidden="true">
      <path d="M48 142C80 67 151 42 194 28C183 77 154 134 77 169C63 175 49 167 48 142Z" />
      <path d="M78 154C104 111 141 77 187 38" />
      <path d="M79 101C54 91 43 68 42 44C72 51 91 68 100 96" />
    </svg>

    <svg class="line-art line-art-right" viewBox="0 0 230 230" aria-hidden="true">
      <path d="M37 157C76 90 143 63 204 50C191 106 156 168 81 191C57 198 36 184 37 157Z" />
      <path d="M70 177C104 127 150 87 204 50" />
      <path d="M111 105C88 86 79 60 83 34C113 47 134 68 141 100" />
    </svg>

    <div class="bean bean-one" aria-hidden="true"></div>
    <div class="bean bean-two" aria-hidden="true"></div>
    <div class="bean bean-three" aria-hidden="true"></div>

    <div class="loader-center">
      <div class="traffic-stage" aria-hidden="true">
        <div class="traffic-signal">
          <span class="lamp lamp-red"></span>
          <span class="lamp lamp-yellow"></span>
          <span class="lamp lamp-green"></span>
        </div>
      </div>

      <div class="disc-row" aria-hidden="true">
        <span class="disc red"></span>
        <span class="disc yellow"></span>
        <span class="disc green"></span>
      </div>

      <div class="final-brand">
        <div class="logo-glow" aria-hidden="true"></div>
        <img class="brand-logo" src="assets/logo-transparent.png" alt="3Singles Cafe Chiplun" />
        <div class="steam steam-a" aria-hidden="true"></div>
        <div class="steam steam-b" aria-hidden="true"></div>
        <div class="steam steam-c" aria-hidden="true"></div>
      </div>

      <div class="loader-caption" aria-live="polite">
        <span>Brewing Happiness...</span>
      </div>

      <div class="progress-track" aria-hidden="true">
        <span class="progress-fill"></span>
        <span class="progress-dot"></span>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
