<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3Singles Café — Concept Redesign</title>
    <style>
        /* --- BRAND DESIGN SYSTEM --- */
        :root {
            --bg-primary: #fcfbfa;
            --bg-dark: #121212;
            --text-main: #1c1c1c;
            --text-muted: #666666;
            
            /* 3Singles Cafe Brand Colors */
            --brand-red: #e63946;
            --brand-yellow: #ffb703;
            --brand-green: #2a9d8f;
            
            /* Custom Hand-Crafted Beziers */
            --ease-custom: cubic-bezier(0.85, 0, 0.15, 1);
            --ease-out-back: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- RESTORED EXPANDING SIGNAL PRELOADER --- */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-dark);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Hides the black background after the circles expand */
            animation: hidePreloaderBg 0.1s linear 2.5s forwards;
        }

        .loader-dots {
            display: flex;
            gap: 1.5rem;
            position: relative;
            z-index: 10000;
        }

        .dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            /* Starts off-screen */
            transform: translateY(-100vh) scale(0.5); 
            
            /* 1. Drop in | 2. Pulse | 3. Expand out to reveal */
            animation: 
                dropIn 0.6s var(--ease-out-back) forwards,
                pulse 0.4s ease-in-out 1.2s 2,
                expandOut 0.7s var(--ease-custom) 2s forwards;
        }

        /* Staggered drop-ins, but synced pulsing and expanding */
        .dot-red { 
            background-color: var(--brand-red); 
            animation-delay: 0s, 1s, 2s; 
        }
        .dot-yellow { 
            background-color: var(--brand-yellow); 
            animation-delay: 0.15s, 1s, 2s; 
        }
        .dot-green { 
            background-color: var(--brand-green); 
            animation-delay: 0.3s, 1s, 2s; 
        }

        @keyframes dropIn {
            to { transform: translateY(0) scale(1); }
        }

        @keyframes pulse {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(0) scale(1.2); }
        }

        @keyframes expandOut {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            /* Expands massively to cover screen, then fades out */
            100% { transform: translateY(0) scale(150); opacity: 0; }
        }

        @keyframes hidePreloaderBg {
            to { visibility: hidden; opacity: 0; z-index: -1; }
        }

        /* --- STRUCTURAL SKELETON PLACEHOLDER --- */
        .asset-wrapper {
            position: relative;
            width: 100%;
            background-color: #eee;
            overflow: hidden;
            border-radius: 12px;
        }

        .asset-wrapper::before {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            background: linear-gradient(90deg, #f0f0f0 25%, #f7f7f7 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite linear;
            z-index: 1;
        }

        .asset-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            z-index: 2;
        }

        .asset-wrapper.loaded::before { display: none; }
        .asset-wrapper.loaded img { opacity: 1; }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        /* --- ASYMMETRIC ANTI-TEMPLATE LAYOUT --- */
        header {
            padding: 2.5rem 4%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            text-transform: lowercase;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: minmax(320px, 1fr) minmax(300px, 1.2fr);
            gap: 4rem;
            padding: 2rem 4% 8rem 4%;
            max-width: 1440px;
            margin: 0 auto;
            align-items: center;
        }

        @media (max-width: 768px) {
            .hero-grid { grid-template-columns: 1fr; gap: 2rem; padding-bottom: 4rem; }
        }

        .hero-content { padding-right: 5%; }

        .hero-tagline {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--brand-red);
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .hero-title {
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            line-height: 0.95;
            font-weight: 900;
            letter-spacing: -0.04em;
            margin-bottom: 2rem;
        }

        .hero-desc {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            max-width: 440px;
        }

        .hero-media-frame {
            aspect-ratio: 4 / 5;
            transform: rotate(1deg);
            box-shadow: 0 30px 60px -15px rgba(0,0,0,0.08);
            transition: transform 0.8s var(--ease-custom);
        }

        .hero-media-frame:hover {
            transform: rotate(0deg) scale(1.02);
        }

        .cta-btn {
            display: inline-flex;
            align-items: center;
            padding: 1.2rem 2.5rem;
            background-color: var(--bg-dark);
            color: white;
            text-decoration: none;
            font-weight: 600;
            border-radius: 50px;
            font-size: 0.95rem;
            transition: transform 0.3s var(--ease-out-back), background-color 0.3s ease;
        }

        .cta-btn:hover {
            background-color: var(--brand-red);
            transform: translateY(-4px);
        }
    </style>
</head>
<body>

    <div id="preloader">
        <div class="loader-dots">
            <div class="dot dot-red"></div>
            <div class="dot dot-yellow"></div>
            <div class="dot dot-green"></div>
        </div>
    </div>

    <header>
        <div class="brand-logo">3singles<span style="color: var(--brand-green);">.</span>café</div>
    </header>

    <main>
        <section class="hero-grid">
            <div class="hero-content">
                <p class="hero-tagline">Fresh & Hygienic</p>
                <h1 class="hero-title">Taste You<br>Can Trust.</h1>
                <p class="hero-desc">Bespoke culinary drops served daily in Chiplun. Exploring authentic recipes crafted with surgical attention to detail.</p>
                <a href="#" class="cta-btn">Explore Menu Drops</a>
            </div>
            
            <div class="asset-wrapper hero-media-frame">
                <img src="your-placeholder-file.jpg" alt="Premium Food Presentation" onload="this.parentElement.classList.add('loaded')">
            </div>
        </section>
    </main>

</body>
</html>
