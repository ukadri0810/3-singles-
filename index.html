<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>3Singles Cafe Premium Loader</title>
  <meta name="theme-color" content="#fbf3e6" />
  <style>
    :root {
      --cream: #fbf3e6;
      --cream-2: #fffaf0;
      --coffee: #3c261a;
      --coffee-soft: rgba(80, 46, 28, 0.16);
      --red: #ed1b24;
      --yellow: #ffc43d;
      --green: #23b85b;
      --shadow: rgba(58, 34, 19, 0.22);
      --ease-out: cubic-bezier(.16,1,.3,1);
      --ease-inout: cubic-bezier(.65,0,.35,1);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      min-height: 100svh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--cream);
      overflow: hidden;
      color: var(--coffee);
    }

    .loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      overflow: hidden;
      min-height: 100svh;
      background:
        radial-gradient(circle at 18% 18%, rgba(255, 202, 94, 0.30), transparent 30rem),
        radial-gradient(circle at 82% 20%, rgba(54, 181, 96, 0.13), transparent 24rem),
        radial-gradient(circle at 50% 96%, rgba(229, 113, 36, 0.18), transparent 24rem),
        linear-gradient(145deg, #fffdf8 0%, #fff5e3 46%, #f9ead5 100%);
      transition: opacity 900ms var(--ease-out), visibility 900ms var(--ease-out);
    }

    body.loaded .loader {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(94, 65, 43, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(94, 65, 43, 0.055) 1px, transparent 1px);
      background-size: 92px 92px;
      mask-image: radial-gradient(circle at 50% 48%, black 0 48%, transparent 82%);
      opacity: .58;
      pointer-events: none;
    }

    .loader::after {
      content: "";
      position: absolute;
      inset: -20%;
      background:
        radial-gradient(circle at 50% 45%, rgba(255,255,255,.72), transparent 20rem),
        radial-gradient(circle at 50% 50%, transparent 0 34rem, rgba(123, 75, 39, .10) 57rem);
      pointer-events: none;
    }

    .line-art {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      opacity: .28;
      color: #98643c;
      pointer-events: none;
    }

    .bean {
      position: absolute;
      z-index: 2;
      width: clamp(22px, 4vw, 42px);
      aspect-ratio: 1.45 / 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 33% 28%, rgba(255,255,255,.34), transparent 18%),
        linear-gradient(135deg, #8f4d25 0%, #5a2e16 43%, #2e160b 100%);
      box-shadow: 0 14px 28px rgba(64, 35, 18, .18);
      transform: rotate(var(--r));
      opacity: .88;
      animation: beanFloat 5.6s ease-in-out infinite alternate;
    }
    .bean::after {
      content: "";
      position: absolute;
      top: 12%; bottom: 12%; left: 49%;
      width: 2px;
      border-radius: 999px;
      background: rgba(30, 14, 6, .78);
      transform: rotate(12deg);
      box-shadow: 5px 0 8px rgba(255,255,255,.12);
    }
    .bean-a { left: 10%; bottom: 16%; --r: -28deg; animation-delay: .4s; }
    .bean-b { right: 12%; bottom: 18%; --r: 23deg; animation-delay: 1.2s; }
    .bean-c { left: 52%; top: 15%; --r: 88deg; opacity: .78; width: clamp(18px, 3.6vw, 34px); animation-delay: .8s; }

    @keyframes beanFloat {
      from { translate: 0 0; }
      to { translate: 0 -10px; }
    }

    .stage {
      position: relative;
      z-index: 3;
      width: min(92vw, 820px);
      height: min(78svh, 620px);
      min-height: 470px;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .signal-wrap {
      position: absolute;
      left: 50%;
      top: 47%;
      width: clamp(72px, 15vw, 112px);
      height: clamp(205px, 38vw, 320px);
      transform: translate(-50%, -50%) scale(.82);
      transform-origin: center;
      opacity: 0;
      animation: signalTimeline 5.8s var(--ease-inout) both;
      will-change: transform, opacity, filter;
      filter: drop-shadow(0 28px 34px rgba(44, 24, 13, .23));
    }

    .signal-body {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      overflow: hidden;
      background:
        linear-gradient(130deg, rgba(255,255,255,.12), transparent 34%),
        linear-gradient(180deg, #25221e 0%, #0d0c0b 68%, #080807 100%);
      box-shadow:
        inset 7px 7px 16px rgba(255,255,255,.055),
        inset -14px -18px 28px rgba(0,0,0,.58),
        0 22px 42px rgba(63,35,18,.24);
      border: 1px solid rgba(255,255,255,.10);
    }

    .signal-body::before {
      content: "";
      position: absolute;
      inset: 7%;
      border-radius: inherit;
      border: 1px solid rgba(255,255,255,.05);
      pointer-events: none;
    }

    .lamp {
      position: absolute;
      left: 50%;
      width: 58%;
      aspect-ratio: 1;
      border-radius: 50%;
      transform: translateX(-50%);
      background: radial-gradient(circle at 34% 28%, rgba(255,255,255,.18), transparent 18%), var(--lamp);
      box-shadow:
        inset 0 10px 18px rgba(255,255,255,.05),
        inset 0 -14px 20px rgba(0,0,0,.48),
        0 0 0 9px rgba(0,0,0,.35);
      opacity: .22;
      filter: saturate(.85);
      animation: lampSequence 5.8s ease both;
    }
    .lamp.red { top: 11%; --lamp: var(--red); --glow: rgba(237,27,36,.62); animation-delay: .35s; }
    .lamp.yellow { top: 50%; transform: translate(-50%, -50%); --lamp: var(--yellow); --glow: rgba(255,196,61,.62); animation-delay: .85s; }
    .lamp.green { bottom: 11%; --lamp: var(--green); --glow: rgba(35,184,91,.62); animation-delay: 1.35s; }

    @keyframes lampSequence {
      0%, 12% { opacity: .22; filter: saturate(.55) brightness(.65); box-shadow: inset 0 10px 18px rgba(255,255,255,.03), inset 0 -14px 20px rgba(0,0,0,.55), 0 0 0 9px rgba(0,0,0,.35); }
      22%, 80% { opacity: 1; filter: saturate(1.12) brightness(1.1); box-shadow: inset 0 9px 20px rgba(255,255,255,.18), inset 0 -12px 20px rgba(0,0,0,.36), 0 0 0 9px rgba(0,0,0,.24), 0 0 24px 7px var(--glow); }
      100% { opacity: .58; filter: saturate(.96) brightness(.95); }
    }

    @keyframes signalTimeline {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(.72) rotate(0deg); filter: blur(2px) drop-shadow(0 28px 34px rgba(44,24,13,.20)); }
      8%   { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0deg); filter: blur(0) drop-shadow(0 28px 34px rgba(44,24,13,.23)); }
      48%  { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
      66%  { opacity: 1; transform: translate(-50%, -50%) scale(1.06) rotate(-90deg); }
      76%  { opacity: .95; transform: translate(-50%, -50%) scale(1.12) rotate(-90deg); filter: blur(0) drop-shadow(0 18px 28px rgba(44,24,13,.16)); }
      88%  { opacity: 0; transform: translate(-50%, -50%) scale(1.18) rotate(-90deg); filter: blur(7px) drop-shadow(0 0 28px rgba(255,214,120,.22)); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.18) rotate(-90deg); filter: blur(9px); }
    }

    .logo-wrap {
      position: relative;
      width: min(86vw, 610px);
      min-height: clamp(270px, 46vw, 440px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(18px, 4vw, 40px) 0 0;
      opacity: 0;
      transform: translateY(12px) scale(.965);
      animation: logoReveal 5.8s var(--ease-out) both;
      will-change: transform, opacity;
    }

    .halo {
      position: absolute;
      left: 50%;
      top: 47%;
      width: min(88vw, 600px);
      aspect-ratio: 1;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(.92);
      background:
        radial-gradient(circle, rgba(255,255,255,.38) 0 49%, rgba(255,255,255,.11) 50%, transparent 66%);
      box-shadow:
        inset 0 0 0 1px rgba(120, 82, 54, .12),
        0 30px 80px rgba(99, 61, 33, .10);
      opacity: 0;
      animation: haloDraw 5.8s var(--ease-out) both;
      pointer-events: none;
    }

    .halo::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: conic-gradient(from 235deg, rgba(132, 83, 48, .0), rgba(132, 83, 48, .23), rgba(255,255,255,.45), rgba(132, 83, 48, .12), rgba(132, 83, 48, .0));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: .8;
    }

    .steam {
      position: absolute;
      top: clamp(8px, 4vw, 22px);
      left: 50%;
      width: min(72vw, 460px);
      height: clamp(95px, 16vw, 150px);
      transform: translateX(-50%);
      pointer-events: none;
      opacity: 0;
      animation: steamFade 5.8s ease both;
      filter: blur(.2px);
    }
    .steam span {
      position: absolute;
      bottom: 0;
      width: 38%;
      height: 100%;
      border-radius: 50%;
      border-left: 2px solid rgba(255,255,255,.70);
      border-top: 1px solid rgba(255,255,255,.28);
      transform-origin: bottom center;
      animation: steamRise 3.8s ease-in-out infinite;
    }
    .steam span:nth-child(1) { left: 7%; animation-delay: .2s; transform: rotate(-12deg); }
    .steam span:nth-child(2) { left: 34%; height: 110%; animation-delay: .7s; transform: rotate(8deg); }
    .steam span:nth-child(3) { right: 7%; animation-delay: 1.15s; transform: rotate(13deg); }

    @keyframes steamRise {
      0% { opacity: 0; translate: 0 26px; scale: .82; }
      35% { opacity: .64; }
      100% { opacity: 0; translate: 0 -26px; scale: 1.12; }
    }

    .brand-logo {
      position: relative;
      z-index: 2;
      display: block;
      width: min(80vw, 545px);
      height: auto;
      object-fit: contain;
      filter:
        drop-shadow(0 18px 24px rgba(80,46,28,.13))
        drop-shadow(0 1px 0 rgba(255,255,255,.4));
      transform: translateZ(0);
      animation: logoBreath 2.9s ease-in-out 4.7s infinite alternate;
    }

    .shine {
      position: absolute;
      z-index: 3;
      width: 62%;
      height: 42%;
      top: 32%;
      left: -22%;
      background: linear-gradient(100deg, transparent 8%, rgba(255,255,255,.48) 45%, transparent 78%);
      transform: rotate(12deg) translateX(-120%);
      mix-blend-mode: screen;
      opacity: 0;
      animation: logoShine 5.8s ease both;
      pointer-events: none;
    }

    .status {
      position: relative;
      z-index: 2;
      margin-top: clamp(3px, 1vw, 10px);
      font-size: clamp(13px, 2.6vw, 21px);
      letter-spacing: .38em;
      text-indent: .38em;
      color: rgba(65, 37, 23, .78);
      font-weight: 500;
      opacity: 0;
      animation: textIn 5.8s var(--ease-out) both;
      white-space: nowrap;
    }

    .progress {
      position: relative;
      z-index: 2;
      margin-top: clamp(16px, 3vw, 22px);
      width: min(72vw, 420px);
      height: 9px;
      border-radius: 999px;
      overflow: visible;
      background: rgba(93, 60, 39, .10);
      box-shadow: inset 0 1px 2px rgba(77,45,27,.14), 0 12px 28px rgba(80,46,28,.07);
      opacity: 0;
      animation: progressIn 5.8s var(--ease-out) both;
    }

    .progress-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--red) 0 32%, var(--yellow) 32% 58%, var(--green) 58% 100%);
      animation: progressFill 5.8s var(--ease-inout) both;
      box-shadow: 0 0 18px rgba(35,184,91,.24);
    }
    .progress-dot {
      position: absolute;
      top: 50%;
      left: 0%;
      width: 21px;
      height: 21px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: var(--green);
      box-shadow: 0 0 0 6px rgba(35,184,91,.13), 0 0 25px rgba(35,184,91,.55);
      animation: progressDot 5.8s var(--ease-inout) both;
    }

    @keyframes logoReveal {
      0%, 56% { opacity: 0; transform: translateY(14px) scale(.96); filter: blur(3px); }
      68% { opacity: 1; transform: translateY(0) scale(1.012); filter: blur(0); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }
    @keyframes haloDraw {
      0%, 54% { opacity: 0; transform: translate(-50%, -50%) scale(.82) rotate(-12deg); }
      72% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0); }
      100% { opacity: .95; transform: translate(-50%, -50%) scale(1) rotate(0); }
    }
    @keyframes steamFade {
      0%, 62% { opacity: 0; }
      76%, 100% { opacity: 1; }
    }
    @keyframes logoShine {
      0%, 72% { opacity: 0; transform: rotate(12deg) translateX(-130%); }
      78% { opacity: .55; }
      92%, 100% { opacity: 0; transform: rotate(12deg) translateX(210%); }
    }
    @keyframes textIn {
      0%, 70% { opacity: 0; transform: translateY(10px); }
      82%, 100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes progressIn {
      0%, 74% { opacity: 0; transform: translateY(8px) scaleX(.92); }
      84%, 100% { opacity: 1; transform: translateY(0) scaleX(1); }
    }
    @keyframes progressFill {
      0%, 76% { width: 0%; }
      90% { width: 72%; }
      100% { width: 100%; }
    }
    @keyframes progressDot {
      0%, 76% { left: 0%; opacity: 0; }
      78% { opacity: 1; }
      90% { left: 72%; }
      100% { left: 100%; }
    }
    @keyframes logoBreath {
      from { transform: translateY(0) scale(1); }
      to { transform: translateY(-2px) scale(1.006); }
    }

    .site-preview {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 32px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 900ms var(--ease-out), transform 900ms var(--ease-out);
      background: linear-gradient(135deg, #fff9ee, #f9ead5);
    }
    body.loaded .site-preview { opacity: 1; transform: translateY(0); }
    .site-card {
      width: min(920px, 92vw);
      border-radius: 32px;
      padding: clamp(28px, 5vw, 56px);
      background: rgba(255,255,255,.62);
      box-shadow: 0 28px 80px rgba(80,46,28,.12);
      border: 1px solid rgba(255,255,255,.78);
      text-align: center;
    }
    .site-card img { width: min(240px, 52vw); height: auto; }
    .site-card h1 { font-size: clamp(28px, 5vw, 56px); line-height: 1.05; margin: 20px 0 10px; letter-spacing: -.04em; }
    .site-card p { margin: 0 auto; max-width: 600px; color: rgba(65,37,23,.72); font-size: clamp(15px, 2vw, 18px); }

    @media (max-width: 600px) {
      body { overflow: hidden; }
      .stage {
        width: 100vw;
        height: 100svh;
        min-height: 560px;
        padding: 0 18px;
      }
      .signal-wrap {
        top: 46%;
        width: 76px;
        height: 218px;
      }
      .logo-wrap {
        width: 100%;
        min-height: 420px;
        padding-top: 18px;
      }
      .halo {
        width: min(88vw, 430px);
        top: 49%;
      }
      .brand-logo { width: min(82vw, 390px); }
      .progress { width: min(78vw, 360px); height: 8px; }
      .status { font-size: 13px; letter-spacing: .24em; text-indent: .24em; }
      .line-art { opacity: .22; }
      .bean-a { left: 8%; bottom: 17%; }
      .bean-b { right: 8%; bottom: 17%; }
      .bean-c { left: 52%; top: 17%; }
    }

    @media (max-height: 620px) {
      .stage { min-height: 470px; height: 100svh; }
      .brand-logo { width: min(76vw, 450px); }
      .halo { width: min(72vw, 450px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
      .loader { display: none; }
      .site-preview { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div class="loader" id="loader" aria-label="Loading 3Singles Cafe website">
    <svg class="line-art" viewBox="0 0 1200 800" fill="none" aria-hidden="true">
      <path d="M56 222C96 172 128 169 148 176C117 195 91 221 66 262C57 250 53 237 56 222Z" stroke="currentColor" stroke-width="2" opacity=".6"/>
      <path d="M36 316C92 310 128 326 154 362C95 362 63 344 36 316Z" stroke="currentColor" stroke-width="2" opacity=".55"/>
      <path d="M1010 174C1058 158 1100 170 1144 214C1081 220 1042 206 1010 174Z" stroke="currentColor" stroke-width="2" opacity=".58"/>
      <path d="M1028 216C1070 240 1112 244 1162 230" stroke="currentColor" stroke-width="2" opacity=".42"/>
      <path d="M1010 657c45-38 93-35 132 0" stroke="currentColor" stroke-width="2" opacity=".52"/>
      <path d="M1032 657h90v56c0 28-20 48-45 48h0c-25 0-45-20-45-48v-56Z" stroke="currentColor" stroke-width="2" opacity=".52"/>
      <path d="M1048 626c-12 18 8 28-2 45M1080 626c-13 18 7 28-3 45M1111 626c-12 18 8 28-2 45" stroke="currentColor" stroke-width="2" opacity=".46" stroke-linecap="round"/>
    </svg>

    <div class="bean bean-a"></div>
    <div class="bean bean-b"></div>
    <div class="bean bean-c"></div>

    <section class="stage">
      <div class="signal-wrap" aria-hidden="true">
        <div class="signal-body">
          <i class="lamp red"></i>
          <i class="lamp yellow"></i>
          <i class="lamp green"></i>
        </div>
      </div>

      <div class="logo-wrap">
        <div class="halo"></div>
        <div class="steam" aria-hidden="true"><span></span><span></span><span></span></div>
        <img class="brand-logo" src="assets/logo-transparent.png" alt="3Singles Cafe Chiplun logo" />
        <span class="shine" aria-hidden="true"></span>
        <div class="status">Brewing Happiness...</div>
        <div class="progress" aria-hidden="true">
          <span class="progress-fill"></span>
          <span class="progress-dot"></span>
        </div>
      </div>
    </section>
  </div>

  <main class="site-preview">
    <section class="site-card">
      <img src="assets/logo-transparent.png" alt="3Singles Cafe Chiplun logo" />
      <h1>Welcome to 3Singles Cafe</h1>
      <p>This is a lightweight demo page showing how the loader transitions into the website. Replace this section with the actual cafe homepage.</p>
    </section>
  </main>

  <script>
    // Keep animation independent from external libraries so it works smoothly on mobile and GitHub Pages.
    const minimumAnimationTime = 6400;
    window.addEventListener('load', () => {
      window.setTimeout(() => {
        document.body.classList.add('loaded');
      }, minimumAnimationTime);
    });
  </script>
</body>
</html>
