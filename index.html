<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>3Singles Cafe Premium Loader</title>
  <meta name="theme-color" content="#f8efe2" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="loader" id="loader" aria-label="Loading 3Singles Cafe website">
    <div class="loader-bg">
      <div class="bg-glow glow-left"></div>
      <div class="bg-glow glow-right"></div>
      <div class="bg-glow glow-bottom"></div>
      <div class="grain"></div>
      <svg class="line-art" viewBox="0 0 1440 1024" aria-hidden="true">
        <path d="M112 276c38-64 82-88 132-72-44 30-73 70-96 132-31-16-47-36-36-60Z" />
        <path d="M76 420c78-8 128 14 176 62-81 8-133-14-176-62Z" />
        <path d="M1234 220c76 8 118 42 152 102-76-8-122-40-152-102Z" />
        <path d="M1228 278c68 26 120 30 166 12" />
        <path d="M1190 810c86-76 162-62 220 0" />
        <path d="M1226 814h132v72c0 32-24 56-56 56h-20c-32 0-56-24-56-56v-72Z" />
        <path d="M1248 778c-18 26 12 42-2 64M1296 778c-18 24 12 42-2 64M1344 778c-18 26 12 42-2 64" class="steam-lines"/>
      </svg>
    </div>

    <div class="stage" id="stage">
      <div class="scene-shadow"></div>

      <div class="signal" aria-hidden="true">
        <div class="signal-shell">
          <span class="lens red"></span>
          <span class="lens yellow"></span>
          <span class="lens green"></span>
        </div>
      </div>

      <div class="brand-block">
        <div class="brand-halo"></div>
        <div class="steam-wrap" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <div class="logo-stage">
          <div class="orbs" aria-hidden="true">
            <span class="orb orb-red"></span>
            <span class="orb orb-yellow"></span>
            <span class="orb orb-green"></span>
          </div>
          <img class="brand-logo" src="assets/logo-trimmed-transparent.png" alt="3Singles Cafe Chiplun logo" />
          <div class="light-sweep" aria-hidden="true"></div>
        </div>
        <p class="tagline">Brewing Happiness...</p>
        <div class="progress" aria-hidden="true">
          <span class="progress-track"></span>
          <span class="progress-fill"></span>
          <span class="progress-end"></span>
        </div>
      </div>
    </div>
  </div>

  <main class="site-preview">
    <section class="site-card">
      <img src="assets/logo-trimmed-transparent.png" alt="3Singles Cafe Chiplun logo" />
      <h1>Welcome to 3Singles Cafe</h1>
      <p>This is a demo handoff version of the premium loader. Replace this section with the actual homepage and keep the loader wrapper intact.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
